name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/djbclark/ci-image-plektra:latest
            ghcr.io/djbclark/ci-image-plektra:${{ github.sha }}
      - name: Verify the pushed image
        run: |
          img=ghcr.io/djbclark/ci-image-plektra@${{ steps.build.outputs.digest }}
          docker run --rm "$img" bash -c 'id; java -version; node --version; git --version; gcc --version | head -1; ls -l /usr/local/lib/portshim.so; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms"'
          echo "digest: ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
